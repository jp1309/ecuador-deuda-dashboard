name: Actualizar datos y publicar dashboard
on:
  workflow_dispatch:
  schedule:
    # 23:23 UTC = 18:23 Ecuador continental, todos los días.
    - cron: '23 23 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'docs/**', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar importación y cálculos
        run: python -m unittest discover -s tests -v
      - name: Consultar las cinco fuentes y validar
        run: python scripts/update_data.py
      - name: Verificar nuevos datos
        run: python -m unittest discover -s tests -v
      - name: Conservar datos y evidencia de consulta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/dashboard.json data/raw data/quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: consulta diaria BVQ [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
